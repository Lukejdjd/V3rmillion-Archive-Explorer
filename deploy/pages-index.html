<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0;url=/static/search">
  <title>V3rmillion Archive Explorer</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #0a0a0a;
      color: #777;
      font: 14px Arial, sans-serif;
    }
    body { display: grid; place-items: center; }
    main { text-align: center; }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid #292929;
      border-top-color: #cd1818;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>window.location.replace('/static/search');</script>
</head>
<body>
  <main aria-label="Loading archive">
    <div class="spinner" aria-hidden="true"></div>
    <div>Connecting to archive...</div>
  </main>
</body>
</html>
