    <script>
        const RESULTS_PER_PAGE = 12;
        let localIndex = null;
        let sortedResults = [];
        let currentPage = 1;
        let fuseInstance = null;

        const DB_NAME = "V3rmillionArchiveDB";

        const FID_TO_PATH = {
            3:  "Socialising",
            12: "Announcements",
            4:  "Lounge",
            46: "Forum Games & Giveaways",
            13: "User Support",
            5:  "Suggestions/Ideas",
            39: "Ban Appeals",
            8:  "Marketplace",
            65: "Marketplace Discussion",
            11: "Normal Sellers",
            25: "Premium Sellers",
            26: "Disputes",
            34: "Media",
            43: "Vermillion Missionary",
            35: "Graphics",
            50: "Music",
            53: "Anime & Manga",
            7:  "Exploiting",
            10: "Roblox",
            68: "Sales & Services",
            56: "Guides, Tuts & Assistance",
            33: "General Exploiting",
            27: "Technology",
            28: "Information Security",
            63: "Cryptocurrency",
            55: "Hardware & Software Discussion",
            17: "Coding",
            18: "General Coding",
            19: "Lua",
            23: "C/C++",
            20: "Python",
            21: "Java & Android",
            67: "Javascript",
            22: "C#",
            24: "Web Development",
            6:  "Gaming",
            32: "General Gaming",
            9:  "Roblox",
            31: "Minecraft",
            38: "Counter-Strike",
        };
        const STORE_NAME = "IndexStore";
        const DB_VERSION = 1;

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function getCachedIndex(db) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get("index_titles");
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => resolve(null);
            });
        }

        function saveIndexToCache(db, data) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const req = tx.objectStore(STORE_NAME).put(data, "index_titles");
                req.onsuccess = () => resolve(true);
                req.onerror = () => resolve(false);
            });
        }

        async function fetchAndRenderThread(threadId) {
            try {
                const cacheBuster = new Date().getTime();
                const res = await fetch(`/data/parsed/parsed_thread_${threadId}.json?t=${cacheBuster}`);
                if (!res.ok) throw new Error();
                const threadData = await res.json();
                showThreadViewerModal(threadData, threadId);
            } catch {
                alert("Error: Missing or corrupt file path inside data/parsed folder for thread ID: " + threadId);
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            const loadingScreen = document.getElementById('loading-screen');
            const content = document.getElementById('content');
            const loadingText = document.getElementById('loading-text');
            const statusText = document.getElementById('index-status');

            const searchTargetSelect = document.getElementById("searchTarget");
            const searchInput = document.getElementById("searchInput");
            const inputLabel = document.getElementById("inputLabel");

            searchTargetSelect.addEventListener("change", function () {
                if (searchTargetSelect.value === "author_username") {
                    inputLabel.innerText = "3. Target Username";
                    searchInput.placeholder = "e.g., moonwalk";
                } else if (searchTargetSelect.value === "author_id") {
                    inputLabel.innerText = "3. Target Author ID";
                    searchInput.placeholder = "e.g., pid_7919002";
                } else {
                    inputLabel.innerText = "3. Search Keywords...";
                    searchInput.placeholder = "Type keywords here...";
                }
            });

            try {
                const db = await openIndexedDB();
                localIndex = await getCachedIndex(db);

                if (localIndex) {
                    setupSearchEngine();
                    statusText.innerHTML = `Database Loaded from Cache. Threads Mapped: ${Object.keys(localIndex).length.toLocaleString()}`;
                    content.style.display = 'block';
                    loadingScreen.style.display = 'none';
                    checkDeepLinkingParameter();
                    return;
                }

                loadingText.innerHTML = "Cache empty. Initializing high-speed database stream...";

                const response = await fetch('/data/index/titles.json');
                if (!response.ok) throw new Error("Network issue accessing titles.json");

                const reader = response.body.getReader();
                let receivedLength = 0;
                let chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    const megaBytes = (receivedLength / (1024 * 1024)).toFixed(1);
                    loadingText.innerHTML = `Streaming archive database: <b>${megaBytes} MB</b> downloaded...`;
                }

                loadingText.innerHTML = "Assembling streaming data blocks...";
                let chunksAll = new Uint8Array(receivedLength);
                let position = 0;
                for(let chunk of chunks) {
                    chunksAll.set(chunk, position);
                    position += chunk.length;
                }

                loadingText.innerHTML = "Finalizing search memory mapping...";
                const resultText = new TextDecoder("utf-8").decode(chunksAll);
                localIndex = JSON.parse(resultText);

                await saveIndexToCache(db, localIndex);

                setupSearchEngine();
                statusText.innerHTML = `Database Cached & Loaded. Threads Mapped: ${Object.keys(localIndex).length.toLocaleString()}`;
                content.style.display = 'block';
                loadingScreen.style.display = 'none';
                checkDeepLinkingParameter();

            } catch (error) {
                console.error("Database lifecycle exception:", error);
                loadingText.innerHTML = `<span class="text-danger">Failed to initialize search database.<br>Verify data/index/titles.json exists.</span>`;
            }
        });

        function checkDeepLinkingParameter() {
            const urlParams = new URLSearchParams(window.location.search);

            const targetThreadId = urlParams.get('id');
            if (targetThreadId) {
                fetchAndRenderThread(targetThreadId);
                return;
            }

            const catFid    = urlParams.get('cat');
            const mode      = urlParams.get('mode');
            const query     = urlParams.get('q');
            const sortBy    = urlParams.get('sort');
            const sortOrder = urlParams.get('order');
            const page      = parseInt(urlParams.get('page') || '1', 10);

            if (catFid) {
                const catDropdown = document.getElementById('categoryDropdown');
                for (const opt of catDropdown.options) {
                    if (opt.value === catFid) { catDropdown.value = catFid; break; }
                }
            }
            if (mode) {
                const modeSelect = document.getElementById('searchTarget');
                modeSelect.value = mode;
                modeSelect.dispatchEvent(new Event('change'));
            }
            if (query)     document.getElementById('searchInput').value = query;
            if (sortBy)    document.getElementById('sortBy').value = sortBy;
            if (sortOrder) document.getElementById('sortOrder').value = sortOrder;

            if (catFid || query || page > 1 || sortBy || sortOrder) {
                executeSearch(isNaN(page) ? 1 : page, false);
            }
        }

        function setupSearchEngine() {
            const fuseData = Object.keys(localIndex).map(id => ({
                id: id,
                title: localIndex[id].title || "",
                author: localIndex[id].author || "Unknown",
                author_id: localIndex[id].author_id || "N/A",
                category: (localIndex[id].categories || []).map(x => x.trim()).join(" / ")
            }));

            fuseInstance = new Fuse(fuseData, {
                keys: ["title", "author", "author_id", "category"],
                threshold: 0.4,
                distance: 100,
                includeScore: true,
                ignoreLocation: true
            });
        }

        function triggerNewSearch() {
            executeSearch(1, true);
        }

        function executeSearch(page = 1, appendHistory = true) {
            currentPage = page;
            const selectedCategory = document.getElementById("categoryDropdown").value.trim();
            const searchTarget     = document.getElementById("searchTarget").value;
            const queryInput       = document.getElementById("searchInput").value.trim();
            const sortBy           = document.getElementById("sortBy").value;
            const sortOrder        = document.getElementById("sortOrder").value;

            const results    = document.getElementById("results");
            const pagination = document.getElementById("pagination");
            const metrics    = document.getElementById("search-metrics");

            results.innerHTML = "";
            pagination.innerHTML = "";
            metrics.style.display = "none";

            if (!fuseInstance) return;

            if (appendHistory) {
                const params = new URLSearchParams();
                if (selectedCategory !== '__ALL__') params.set('cat', selectedCategory);
                if (searchTarget !== 'title')       params.set('mode', searchTarget);
                if (queryInput)                     params.set('q', queryInput);
                if (sortBy !== 'relevance')         params.set('sort', sortBy);
                if (sortOrder !== 'asc')            params.set('order', sortOrder);
                if (page > 1)                       params.set('page', page);
                const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                window.history.pushState({ type: 'search', page: page }, '', newUrl);
            }

            try {
                const start = performance.now();
                let matchedResults = [];

                let baseItems = [];
                if (selectedCategory === "__ALL__") {
                    baseItems = Object.keys(localIndex).map(id => ({
                        id: id,
                        title: localIndex[id].title || "",
                        author: localIndex[id].author || "Unknown",
                        author_id: localIndex[id].author_id || "N/A",
                        category: (localIndex[id].categories || []).map(x => x.trim()).join(" / ")
                    }));
                } else {
                    const fidNum   = parseInt(selectedCategory, 10);
                    const leafName = (FID_TO_PATH[fidNum] || "").toLowerCase().trim();
                    Object.keys(localIndex).forEach(id => {
                        const threadCats = (localIndex[id].categories || []).map(c => c.toLowerCase().trim());
                        if (leafName && threadCats.includes(leafName)) {
                            baseItems.push({
                                id: id,
                                title: localIndex[id].title || "",
                                author: localIndex[id].author || "Unknown",
                                author_id: localIndex[id].author_id || "N/A",
                                category: (localIndex[id].categories || []).map(x => x.trim()).join(" / ")
                            });
                        }
                    });
                }

                if (queryInput) {
                    const lowerQuery = queryInput.toLowerCase();

                    if (searchTarget === "author_username") {
                        const authorSearchInstance = new Fuse(baseItems, {
                            keys: ["author"], threshold: 0.35, distance: 100, ignoreLocation: true, includeScore: true
                        });
                        const rawMatches = authorSearchInstance.search(queryInput);
                        matchedResults = rawMatches.map(match => {
                            let score = match.score ?? 1;
                            if (match.item.author.toLowerCase() === lowerQuery) score -= 0.8;
                            else if (match.item.author.toLowerCase().includes(lowerQuery)) score -= 0.5;
                            return { id: match.item.id, title: match.item.title, finalScore: score };
                        });
                    } else if (searchTarget === "author_id") {
                        const idSearchInstance = new Fuse(baseItems, {
                            keys: ["author_id"], threshold: 0.2, distance: 100, ignoreLocation: true, includeScore: true
                        });
                        const rawMatches = idSearchInstance.search(queryInput);
                        matchedResults = rawMatches.map(match => {
                            let score = match.score ?? 1;
                            if (match.item.author_id.toLowerCase() === lowerQuery) score -= 0.8;
                            return { id: match.item.id, title: match.item.title, finalScore: score };
                        });
                    } else {
                        const titleSearchInstance = new Fuse(baseItems, {
                            keys: ["title"], threshold: 0.4, distance: 100, ignoreLocation: true, includeScore: true
                        });
                        const rawMatches = titleSearchInstance.search(queryInput);
                        matchedResults = rawMatches.map(match => {
                            let score = match.score ?? 1;
                            if (match.item.title.toLowerCase().includes(lowerQuery)) score -= 0.6;
                            return { id: match.item.id, title: match.item.title, finalScore: score };
                        });
                    }
                    matchedResults.sort((a, b) => a.finalScore - b.finalScore);
                } else {
                    matchedResults = baseItems.map(item => ({ id: item.id, title: item.title, finalScore: 0 }));
                }

                // Apply secondary sort
                const direction = sortOrder === 'desc' ? -1 : 1;
                if (sortBy === 'thread_id') {
                    matchedResults.sort((a, b) => direction * (parseInt(a.id, 10) - parseInt(b.id, 10)));
                } else if (sortBy === 'title') {
                    matchedResults.sort((a, b) => direction * (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base' }));
                } else if (sortOrder === 'desc') {
                    matchedResults.sort((a, b) => b.finalScore - a.finalScore);
                }

                sortedResults = matchedResults.map(x => ({ id: x.id, title: x.title }));
                const ms = (performance.now() - start).toFixed(2);

                if (!sortedResults.length) {
                    results.innerHTML = `<div class='col-12'><p class='text-center text-muted my-4'>No results found matching those parameters inside this selection.</p></div>`;
                    metrics.innerHTML = `Search completed in ${ms} ms (0 records matched)`;
                    metrics.style.display = "inline-block";
                    return;
                }

                metrics.innerHTML = `Found ${sortedResults.length.toLocaleString()} matching archive records in ${ms} ms`;
                metrics.style.display = "inline-block";
                renderPage(currentPage, false);

            } catch (err) {
                console.error(err);
                results.innerHTML = `<div class='col-12'><p class='text-center text-danger my-4'>Internal search processing exception occurred.</p></div>`;
            }
        }

        function renderPage(page, appendHistory = true) {
            currentPage = page;
            const resultsContainer = document.getElementById("results");
            resultsContainer.innerHTML = "";

            if (appendHistory) {
                const params = new URLSearchParams(window.location.search);
                if (page > 1) { params.set('page', page); } else { params.delete('page'); }
                const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                window.history.pushState({ type: 'search', page: page }, '', newUrl);
            }

            const startOffset    = (page - 1) * RESULTS_PER_PAGE;
            const activePageSlice = sortedResults.slice(startOffset, Math.min(startOffset + RESULTS_PER_PAGE, sortedResults.length));

            activePageSlice.forEach(thread => {
                const cardWrapper = document.createElement("div");

                    <div class="card h-100 shadow-sm">

                        <a href="/data/parsed/parsed_thread_${thread.id}.json" target="_blank" class="btn btn-link btn-sm mt-1 text-center small text-muted">Open Raw JSON</a>
                      </div>
                    </div>`;
                
                cardWrapper.querySelector(".view-json-btn").onclick = function() {
                    const params = new URLSearchParams(window.location.search);
                    params.set('id', thread.id);
                    const newUrl = window.location.pathname + '?' + params.toString();
                    window.history.pushState({ type: 'thread', id: thread.id }, '', newUrl);

            generatePaginationControls();
        }

        let postCounter = 0;

        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const IFRAMELY_ENDPOINT = '/iframely';

        const IMAGE_HOSTS = new Set([
            'i.imgur.com', 'cdn.discordapp.com', 'media.discordapp.net',
            'i.redd.it', 'preview.redd.it', 'pbs.twimg.com',
            'i.gyazo.com', 'cdn.gyazo.com', 'i.prntscr.com',
            'images-ext-1.discordapp.net', 'images-ext-2.discordapp.net'
        ]);
        const IMAGE_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'avif']);

        const IFRAMELY_HOSTS = new Set([
            'youtube.com', 'www.youtube.com', 'youtu.be',
            'streamable.com', 'www.streamable.com',
            'gyazo.com', 'www.gyazo.com',
            'twitch.tv', 'www.twitch.tv', 'clips.twitch.tv',
            'medal.tv', 'www.medal.tv',
            'prntscr.com', 'www.prntscr.com',
            'imgur.com', 'www.imgur.com',
            'imgbb.com', 'www.imgbb.com',
            'flickr.com', 'www.flickr.com',
            'tenor.com', 'www.tenor.com',
            'giphy.com', 'www.giphy.com',
            'vimeo.com', 'www.vimeo.com',
            'reddit.com', 'www.reddit.com', 'v.redd.it',
            'instagram.com', 'www.instagram.com',
            'tiktok.com', 'www.tiktok.com',
            'soundcloud.com', 'www.soundcloud.com',
            'open.spotify.com',
        ]);

        function isImageUrl(raw) {
            try {
                const url = new URL(raw);
                if (IMAGE_HOSTS.has(url.hostname)) return true;
                const ext = url.pathname.split('.').pop().toLowerCase();
                if (IMAGE_EXTS.has(ext)) return true;
                for (const val of url.searchParams.values()) {
                    try {
                        const inner = new URL(decodeURIComponent(val));
                        if (IMAGE_HOSTS.has(inner.hostname)) return true;
                        const innerExt = inner.pathname.split('.').pop().toLowerCase();
                        if (IMAGE_EXTS.has(innerExt)) return true;
                    } catch {}
                }
                const fullPath = url.pathname + url.search;
                const lastExt = fullPath.split('.').pop().split('&')[0].split('?')[0].toLowerCase();
                if (IMAGE_EXTS.has(lastExt)) return true;
                return false;
            } catch { return false; }
        }

        function isIframelyUrl(raw) {
            try {
                const url = new URL(raw);
                return IFRAMELY_HOSTS.has(url.hostname);
            } catch { return false; }
        }

        const _iframelyCache = new Map();

        async function fetchIframelyEmbed(url) {
            if (_iframelyCache.has(url)) return _iframelyCache.get(url);
            try {
                const apiUrl = `${IFRAMELY_ENDPOINT}?url=${encodeURIComponent(url)}`;
                const res = await fetch(apiUrl, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error('iframely non-ok');
                const data = await res.json();
                const allLinks = Object.values(data.links || {}).flat();
                const embedLink = allLinks.find(l =>
                    l.html && (l.rel?.includes('player') || l.rel?.includes('app') || l.rel?.includes('reader'))
                );
                const html = embedLink?.html || null;
                _iframelyCache.set(url, html || 'error');
                return html;
            } catch {
                _iframelyCache.set(url, 'error');
                return null;
            }
        }

        async function resolveIframelySlots(container) {
            const slots = container.querySelectorAll('[data-iframely-url]');
            await Promise.allSettled([...slots].map(async (slot) => {
                const url = slot.getAttribute('data-iframely-url');
                const html = await fetchIframelyEmbed(url);
                if (html && html !== 'error') {
                    slot.innerHTML = html;
                    slot.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        [...oldScript.attributes].forEach(a => newScript.setAttribute(a.name, a.value));
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                } else {
                    slot.outerHTML = `<a href="${escapeHTML(url)}" target="_blank" rel="noopener" style="color:#cd1818;">${escapeHTML(url)}</a>`;
                }
            }));
        }

        function formatPostBody(rawText, threadLang = "lua") {
            if (!rawText) return '';

            const urlParts = rawText.split(/(https?:\/\/\S+)/g);
            rawText = urlParts.filter(part => {
                return !part.startsWith("https://v3rmillion.net/images/");
            }).join('');

            const LANG_MAP = {
                'lua': 'lua', 'python': 'python', 'javascript': 'javascript',
                'java': 'java', 'cpp': 'cpp', 'c++': 'cpp', 'c': 'c',
                'csharp': 'csharp', 'c#': 'csharp', 'ruby': 'ruby',
                'php': 'php', 'bash': 'bash', 'shell': 'shell', 'sql': 'sql',
            };

            function makeCodeBlock(rawCode, langHint) {
                const hljsLang = LANG_MAP[(langHint || '').toLowerCase().trim()] || null;
                let result;
                if (typeof hljs !== 'undefined') {
                    result = hljsLang && hljs.getLanguage(hljsLang)
                        ? hljs.highlight(rawCode, { language: hljsLang })
                        : hljs.highlightAuto(rawCode);
                }
                const highlightedHTML = result ? result.value : escapeHTML(rawCode);
                const detectedLang = (result?.language || hljsLang || 'code').toUpperCase();
                return `<div class="v3rm-code-container" style="margin:12px 0;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden;">
                    <div class="v3rm-code-header" style="background:#161616;color:#aaa;padding:6px 12px;font-family:monospace;font-size:11px;border-bottom:1px solid #222;">Code: ${detectedLang}</div>
                    <pre style="margin:0;"><code class="hljs" style="padding:12px;display:block;overflow-x:auto;background:#050505;font-family:Consolas,Monaco,monospace;font-size:13px;line-height:1.5;">${highlightedHTML}</code></pre>
                </div>`;
            }

            function renderTextSegment(txt) {
                if (!txt) return '';

                txt = txt.replace(/([^\n])\n([^\n])/g, (match, a, b) => {
                    return `${a.trimEnd()} ${b.trimStart()}`;
                });

                const tokens = txt.split(/(https?:\/\/\S+)/g);
                txt = tokens.map((token, i) => {
                    if (i % 2 === 0) return token;
                    const u = token.replace(/['";].*$/, '').trim();
                    if (!u) return token;

                    if (u.includes('v3rmillion.net/showthread.php')) {
                        try {
                            const url = new URL(u);
                            const tid = url.searchParams.get('tid');
                            if (tid) {
                                const base = window.location.origin + window.location.pathname;
                                return `[Thread #${tid}](${base}?id=${tid})`;
                            }
                        } catch {}
                    }

                    if (isImageUrl(u)) return `\n\n![](${u})\n\n`;

                    if (isIframelyUrl(u)) {
                        return `\n\n<div class="v3rm-embed-slot" data-iframely-url="${escapeHTML(u)}"><span class="embed-loading">Loading embed…</span></div>\n\n`;
                    }

                    return u;
                }).join('');

                return marked.parse(txt);
            }

            const parts = rawText.split(/\s*\[CODE_START\]\s*|\s*\[CODE_END\]\s*/);
            if (parts.length === 1) return renderTextSegment(rawText);

            let html = '';
            if (parts[0]) html += renderTextSegment(parts[0]);
            for (let i = 1; i < parts.length; i += 2) {
                const code = parts[i] || '';
                const textAfter = parts[i + 1] || '';
                html += makeCodeBlock(code, threadLang);
                if (textAfter) html += renderTextSegment(textAfter);
            }
            return html;
        }
        
        function parseFallbackDate(post) {
            if (post.post_date && post.post_date.trim() !== "") return post.post_date;
            if (post.last_edit && post.last_edit.includes("modified:")) {
                const match = post.last_edit.match(/modified:\s*([^)]+)/i);
                if (match && match[1]) return match[1].trim();
            }
            return "Archived Post";
        }

        function buildPostHTML(post, isOP = false, depth = 0) {
            postCounter++;
            const num = postCounter;

            const authorName  = post.author_username || 'Unknown';
            const displayDate = parseFallbackDate(post);

            let editNotice = "";
            const postDateStr = post.post_date ? post.post_date.trim() : "";
            const lastEditStr = post.last_edit ? post.last_edit.trim() : "";
            if (lastEditStr && postDateStr && lastEditStr !== postDateStr) {
                editNotice = `(This post was last modified: ${lastEditStr} by ${authorName})`;
            }

            const userTitle   = post.user_title   || null;
            const userRank    = post.user_rank     || null;
            const reputation  = post.reputation    || null;
            const postCount   = post.post_count    || null;
            const threadCount = post.thread_count  || null;
            const joinDate    = post.join_date     || null;

            const statParts = [];
            if (postCount)   statParts.push(`Posts: <strong style="color:#ccc;">${escapeHTML(postCount)}</strong>`);
            if (threadCount) statParts.push(`Threads: <strong style="color:#ccc;">${escapeHTML(threadCount)}</strong>`);
            if (joinDate)    statParts.push(`Joined: <strong style="color:#ccc;">${escapeHTML(joinDate)}</strong>`);
            if (reputation !== null) statParts.push(`Rep: <strong style="color:${parseInt(reputation) >= 0 ? '#29cb09' : '#b40404'};">${escapeHTML(String(reputation))}</strong>`);

            const statsLine     = statParts.length ? `<div class="v3rm-author-stats" style="margin-top:3px;">${statParts.join(' &nbsp;·&nbsp; ')}</div>` : '';
            const rankBadge     = userRank  ? `<span style="font-size:10px;background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:1px 5px;border-radius:3px;margin-left:5px;">${escapeHTML(userRank)}</span>` : '';
            const titleLine     = userTitle ? `<div style="font-size:11px;color:#666;font-style:italic;margin-top:1px;">${escapeHTML(userTitle)}</div>` : '';
            const postIdBadge   = post.post_id   ? `<span style="font-size:10px;color:#444;margin-left:6px;">post_${escapeHTML(post.post_id)}</span>` : '';
            const authorIdBadge = post.author_id ? `<span style="font-size:10px;color:#444;margin-left:6px;">uid_${escapeHTML(post.author_id)}</span>` : '';

            const formattedContent = formatPostBody(post.post_description || '');

            const repliesHTML = post.replies && post.replies.length > 0
                ? `<div class="v3rm-reply-wrap">${post.replies.map(r => buildPostHTML(r, false, depth + 1)).join('')}</div>`
                : '';

            return `
                <div class="v3rm-post">
                    <div class="v3rm-post-head">
                        <span class="v3rm-post-date-wrapper">
                            <span>${displayDate} by ${escapeHTML(authorName)}</span>
                            ${editNotice ? `<span class="v3rm-edited">${escapeHTML(editNotice)}</span>` : ''}
                            ${authorIdBadge}
                            ${postIdBadge}
                        </span>
                        <span class="v3rm-post-num">#${num}</span>
                    </div>
                    <div class="v3rm-post-author">
                        <div class="w-100">
                            <div class="d-flex align-items-center">
                                <div class="v3rm-author-name ${isOP ? 'op' : ''}">
                                    <strong>${escapeHTML(authorName)}</strong>
                                    ${isOP ? '<span style="font-size:10px;color:#888;">[OP]</span>' : ''}
                                </div>
                                ${rankBadge}
                            </div>
                            ${titleLine}
                            ${statsLine}
                        </div>
                    </div>
                    <div class="v3rm-post-content">
                        <div class="v3rm-post-body">${formattedContent}</div>
                        <div class="v3rm-post-footer">
                            <span class="v3rm-like-btn"><i class="fa fa-thumbs-o-up"></i> ${escapeHTML(post.likes || '0')}</span>
                            <span class="v3rm-like-btn"><i class="fa fa-thumbs-o-down"></i> ${escapeHTML(post.dislikes || '0')}</span>
                        </div>
                    </div>
                    <div class="v3rm-post-controls">
                        ${post.replied_to ? `<span style="color:#888;font-size:11px;">↩ Reply to <strong style="color:#cd1818;">${escapeHTML(post.replied_to)}</strong> (${escapeHTML(post.replied_to_post_date || '')})</span>` : ''}
                    </div>
                </div>
                ${repliesHTML}`;
        }

        function showThreadViewerModal(data, id = "") {
            const existing = document.querySelector('.viewer-overlay');
            if (existing) existing.remove();

            const POSTS_PER_PAGE = 50;

            const cleanTitle = data.title ? data.title.trim() : "Untitled Thread";
            const categoryBreadcrumbs = data.categories && data.categories.length > 0 ? data.categories.join(" » ") : "";

            const allTopLevelPosts = [];
            if (data.thread_content) allTopLevelPosts.push({ post: data.thread_content, isOP: true });
            if (data.replies_to_not_found_posts && data.replies_to_not_found_posts.length > 0) {
                data.replies_to_not_found_posts.forEach(r => allTopLevelPosts.push({ post: r, isOP: false }));
            }

            const totalPosts      = allTopLevelPosts.length;
            const totalPages      = Math.max(1, Math.ceil(totalPosts / POSTS_PER_PAGE));
            let   currentModalPage = 1;

            const overlay = document.createElement("div");
            overlay.className = "viewer-overlay";

            overlay.innerHTML = `
                <div class="viewer-card">
                    <div class="viewer-header">
                        <div style="overflow:hidden; flex-grow: 1;">
                            <div class="d-flex align-items-center gap-2" style="gap: 10px;">
                                <div class="viewer-header-title" title="${escapeHTML(cleanTitle)}" style="max-width: 80%;">${escapeHTML(cleanTitle)}</div>
                                ${id ? `<button class="copy-link-btn" id="modal-copy-btn" data-thread-id="${id}"><i class="fa fa-link"></i> Copy Link</button>` : ''}
                            </div>
                            ${categoryBreadcrumbs ? `<div class="v3rm-make-path v3rm-category-path" style="margin-top: 2px;">${escapeHTML(categoryBreadcrumbs)}</div>` : ''}
                        </div>
                        <button class="viewer-close-btn" id="close-modal-btn">✕ Close</button>
                    </div>
                    <div id="modal-post-pagination" style="display:none; padding: 6px 10px; background:#111; border-bottom: 1px solid #222; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; flex-shrink:0;"></div>
                    <div class="viewer-body" id="modal-viewer-body"></div>
                </div>`;

            document.body.appendChild(overlay);

            function renderModalPage(page) {
                currentModalPage = page;
                postCounter = 0;

                const viewerBody = overlay.querySelector('#modal-viewer-body');
                viewerBody.innerHTML = '';
                viewerBody.scrollTop = 0;

                const start = (page - 1) * POSTS_PER_PAGE;
                const slice = allTopLevelPosts.slice(start, start + POSTS_PER_PAGE);

                let html = '';
                if (slice.length === 0) {
                    html = '<p style="color:#666;padding:20px;text-align:center;">No readable body records found inside file.</p>';
                } else {
                    const opCount = data.thread_content ? 1 : 0;
                    slice.forEach(({ post, isOP }, sliceIdx) => {
                        const absoluteIdx = start + sliceIdx;
                        if (opCount > 0 && absoluteIdx === opCount && data.replies_to_not_found_posts && data.replies_to_not_found_posts.length > 0) {
                            html += `<div class="v3rm-not-found-label">— ${data.replies_to_not_found_posts.length} reply/replies to posts not found in archive —</div>`;
                        }
                        html += buildPostHTML(post, isOP, 0);
                    });
                }

                viewerBody.innerHTML = html;
                resolveIframelySlots(viewerBody);
                renderModalPagination();
            }

            function renderModalPagination() {
                const paginationBar = overlay.querySelector('#modal-post-pagination');
                if (totalPages <= 1) { paginationBar.style.display = 'none'; return; }
                paginationBar.style.display = 'flex';

                const pageInfo = `<span style="font-size:11px;color:#666;">Page ${currentModalPage} of ${totalPages} &nbsp;·&nbsp; ${totalPosts} posts</span>`;

                let btnHTML = '<div style="display:flex;gap:4px;flex-wrap:wrap;">';
                const prev = currentModalPage > 1;
                const next = currentModalPage < totalPages;
                btnHTML += `<button onclick="modalGoTo(${currentModalPage - 1})" style="${modalBtnStyle(!prev)}">&laquo; Prev</button>`;

                let startP = Math.max(1, currentModalPage - 3);
                let endP   = Math.min(totalPages, startP + 6);
                if (endP - startP < 6) startP = Math.max(1, endP - 6);

                for (let i = startP; i <= endP; i++) {
                    const active = i === currentModalPage;
                    btnHTML += `<button onclick="modalGoTo(${i})" style="${modalBtnStyle(false, active)}">${i}</button>`;
                }

                btnHTML += `<button onclick="modalGoTo(${currentModalPage + 1})" style="${modalBtnStyle(!next)}">Next &raquo;</button>`;
                btnHTML += '</div>';
                paginationBar.innerHTML = pageInfo + btnHTML;
            }

            function modalBtnStyle(disabled, active) {
                const base = 'border:1px solid #2a2a2a;padding:2px 8px;font-size:11px;cursor:pointer;border-radius:2px;';
                if (disabled) return base + 'background:#0a0a0a;color:#333;cursor:not-allowed;';
                if (active)   return base + 'background:#cd1818;border-color:#cd1818;color:#fff;';
                return base + 'background:#1a1a1a;color:#cd1818;';
            }

            window.modalGoTo = function(page) {
                if (page < 1 || page > totalPages) return;
                renderModalPage(page);
            };

            renderModalPage(1);

            const copyBtn = overlay.querySelector('#modal-copy-btn');
            if (copyBtn) {
                copyBtn.onclick = function() {
                    const threadId = this.getAttribute('data-thread-id');
                    const shareUrl = window.location.origin + window.location.pathname + '?id=' + threadId;
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        copyBtn.innerHTML = '<i class="fa fa-check"></i> Copied!';
                        setTimeout(() => { copyBtn.innerHTML = '<i class="fa fa-link"></i> Copy Link'; }, 2000);
                    }).catch(err => console.error('Failed to copy text: ', err));
                };
            }

            const clearUrlParam = () => {
                const params = new URLSearchParams(window.location.search);
                if (params.has('id')) {
                    if (window.history.state === null && document.referrer === "") {
                        window.location.href = `${window.location.origin}${window.location.pathname}`;
                    } else {
                        window.history.back();
                    }
                } else {
                    overlay.remove();
                }
            };

            overlay.querySelector('#close-modal-btn').onclick = clearUrlParam;
            overlay.addEventListener('click', (e) => { if (e.target === overlay) clearUrlParam(); });
        }

        function generatePaginationControls() {
            const paginationContainer = document.getElementById("pagination");
            paginationContainer.innerHTML = "";
            const totalPagesCount = Math.ceil(sortedResults.length / RESULTS_PER_PAGE);
            if (totalPagesCount <= 1) return;

            const paginationList = document.createElement("ul");
            paginationList.classList.add("pagination", "flex-wrap", "justify-content-center");

            const prevItem = document.createElement("li");
            prevItem.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevItem.innerHTML = `<a class="page-link" href="#">Previous</a>`;
            prevItem.onclick = (e) => { e.preventDefault(); if (currentPage > 1) renderPage(currentPage - 1, true); };
            paginationList.appendChild(prevItem);

            let startBtn = Math.max(1, currentPage - 3);
            let endBtn   = Math.min(totalPagesCount, startBtn + 6);
            if (endBtn - startBtn < 6) startBtn = Math.max(1, endBtn - 6);

            for (let i = startBtn; i <= endBtn; i++) {
                const pageItem = document.createElement("li");
                pageItem.className = `page-item ${currentPage === i ? 'active' : ''}`;
                pageItem.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                pageItem.onclick = (e) => { e.preventDefault(); renderPage(i, true); };
                paginationList.appendChild(pageItem);
            }

            const nextItem = document.createElement("li");
            nextItem.className = `page-item ${currentPage === totalPagesCount ? 'disabled' : ''}`;
            nextItem.innerHTML = `<a class="page-link" href="#">Next</a>`;
            nextItem.onclick = (e) => { e.preventDefault(); if (currentPage < totalPagesCount) renderPage(currentPage + 1, true); };
            paginationList.appendChild(nextItem);

            paginationContainer.appendChild(paginationList);
        }

        window.addEventListener('popstate', async function(e) {
            const params = new URLSearchParams(window.location.search);
            const threadId = params.get('id');

            const existing = document.querySelector('.viewer-overlay');
            if (existing) existing.remove();

            if (threadId) {
                await fetchAndRenderThread(threadId);
            } else {
                const cat       = params.get('cat')   || '__ALL__';
                const mode      = params.get('mode')  || 'title';
                const query     = params.get('q')     || '';
                const sortBy    = params.get('sort')  || 'relevance';
                const sortOrder = params.get('order') || 'asc';
                const page      = parseInt(params.get('page') || '1', 10);

                document.getElementById('categoryDropdown').value = cat;

                const modeSelect = document.getElementById('searchTarget');
                modeSelect.value = mode;
                modeSelect.dispatchEvent(new Event('change'));

                document.getElementById('searchInput').value = query;
                document.getElementById('sortBy').value = sortBy;
                document.getElementById('sortOrder').value = sortOrder;

                if (fuseInstance) {
                    executeSearch(isNaN(page) ? 1 : page, false);
                }
            }
        });
    </script>
</body>
