    // ════════════════════════════════════════════════════════════════════════
    // DEEP LINKING
    // ════════════════════════════════════════════════════════════════════════
    function shouldAutoRunDeepLinkSearch(kind) {
        // Spam-refreshing ?q=... links should not re-hit search APIs every reload.
        const key = `deeplink:${kind}:${window.location.search}`;
        try {
            const prev = Number(sessionStorage.getItem(key) || '0');
            if (prev && (Date.now() - prev) < 60_000) return false;
            sessionStorage.setItem(key, String(Date.now()));
        } catch (_) {}
        return true;
    }

    function checkDeepLinkingParameter() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetThreadId = urlParams.get('id');
        if (targetThreadId) {
            if (shouldAutoRunDeepLinkSearch('thread')) {
                fetchAndRenderThread(targetThreadId);
            }
            return;
        }

        const mode = urlParams.get('mode');
        if (mode === 'fts') {
            switchMode('fts');
            const q      = urlParams.get('q')   || '';
            const author = urlParams.get('uid') || '';
            if (q)      document.getElementById('ftsInput').value  = q;
            if (author) document.getElementById('ftsAuthor').value = author;
            if ((q || author) && shouldAutoRunDeepLinkSearch('fts')) {
                suppressUrlUpdate = true;
                triggerFtsSearch();
                suppressUrlUpdate = false;
            }
            return;
        }

        const cat   = urlParams.get('cat')   || '';
        const query = urlParams.get('q')     || '';
        const sort  = urlParams.get('sort')  || 'relevance';
        const order = urlParams.get('order') || 'asc';
        const smode = urlParams.get('smode') || 'title';

        if (cat) document.getElementById('categoryDropdown').value = cat;
        if (smode) {
            const ms = document.getElementById('searchTarget');
            ms.value = smode; ms.dispatchEvent(new Event('change'));
        }
        if (query) document.getElementById('searchInput').value = query;
        if (sort)  document.getElementById('sortBy').value  = sort;
        if (order) document.getElementById('sortOrder').value = order;

        if (cat || query || sort !== 'relevance' || order !== 'asc') {
            indexLastParams = { q: query, cat, smode, sort, order };
            if (shouldAutoRunDeepLinkSearch('index')) {
                suppressUrlUpdate = true;
                runIndexQuery(parseInt(urlParams.get('offset') || '0', 10), true);
                suppressUrlUpdate = false;
            }
        }
    }

    // ════════════════════════════════════════════════════════════════════════
    // POST RENDERER
    // ════════════════════════════════════════════════════════════════════════
    let postCounter = 0;

    function escapeHTML(str) {
        return String(str)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function decodeEntities(str) {
        if (!str) return '';
        const decoder = document.createElement('textarea');
        decoder.innerHTML = String(str);
        return decoder.value;
    }

    const IFRAMELY_ENDPOINT = '/iframely';
    const IMAGE_HOSTS = new Set(['i.imgur.com','cdn.discordapp.com','media.discordapp.net','i.redd.it','preview.redd.it','pbs.twimg.com','i.gyazo.com','cdn.gyazo.com','i.prntscr.com','images-ext-1.discordapp.net','images-ext-2.discordapp.net']);
    const IMAGE_EXTS  = new Set(['png','jpg','jpeg','gif','webp','bmp','avif']);
    const IFRAMELY_HOSTS = new Set(['youtube.com','www.youtube.com','youtu.be','streamable.com','www.streamable.com','gyazo.com','www.gyazo.com','twitch.tv','www.twitch.tv','clips.twitch.tv','medal.tv','www.medal.tv','prntscr.com','www.prntscr.com','imgur.com','www.imgur.com','imgbb.com','www.imgbb.com','flickr.com','www.flickr.com','tenor.com','www.tenor.com','giphy.com','www.giphy.com','vimeo.com','www.vimeo.com','reddit.com','www.reddit.com','v.redd.it','instagram.com','www.instagram.com','tiktok.com','www.tiktok.com','soundcloud.com','www.soundcloud.com','open.spotify.com']);

    function isImageUrl(raw) {
        try {
            const url = new URL(raw);
            if (IMAGE_HOSTS.has(url.hostname)) return true;
            const ext = url.pathname.split('.').pop().toLowerCase();
            if (IMAGE_EXTS.has(ext)) return true;
            return false;
        } catch { return false; }
    }
    function isIframelyUrl(raw) {
        try { return IFRAMELY_HOSTS.has(new URL(raw).hostname); } catch { return false; }
    }

    const _iframelyCache = new Map();
    async function fetchIframelyEmbed(url) {
        if (_iframelyCache.has(url)) return _iframelyCache.get(url);
        try {
            const res  = await fetch(`${IFRAMELY_ENDPOINT}?url=${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(8000) });
            if (!res.ok) throw new Error('iframely non-ok');
            const data = await res.json();
            const allLinks  = Object.values(data.links || {}).flat();
            const embedLink = allLinks.find(l => l.html && (l.rel?.includes('player') || l.rel?.includes('app') || l.rel?.includes('reader')));
            const html      = embedLink?.html || null;
            _iframelyCache.set(url, html || 'error');
            return html;
        } catch {
            _iframelyCache.set(url, 'error');
            return null;
        }
    }

    async function resolveIframelySlots(container) {
        const slots = container.querySelectorAll('[data-iframely-url]');

        await Promise.allSettled([...slots].map(async (slot) => {
            const url = slot.getAttribute('data-iframely-url');
            const html = await fetchIframelyEmbed(url);

            if (html && html !== 'error') {

                // Remove deprecated allowfullscreen attribute
                const cleanHTML = html.replace(/\sallowfullscreen(\s|>)/gi, '$1');

                slot.innerHTML = cleanHTML;

                // Re-run embed scripts
                slot.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');

                    [...oldScript.attributes].forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });

                    newScript.textContent = oldScript.textContent;

                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });

            } else {
                slot.outerHTML = `<a href="${escapeHTML(url)}" target="_blank" rel="noopener" style="color:#cd1818;">${escapeHTML(url)}</a>`;
            }
        }));
    }

    /**
     * Render stored HTML post_description.
     * The parser already converted the MyBB HTML into clean markup with:
     *   - [CODE_START]...[CODE_END] sentinels for code blocks
     *   - <div class="v3rm-spoiler">...</div> for spoilers
     *   - markdown-style image/link syntax for assets
     *   - plain text for everything else
     *
     * We render it directly as HTML but apply syntax highlighting to code blocks
     * and wire up spoiler toggle buttons.
     */
    function renderPostBody(container, rawHtml) {
        if (!rawHtml) { container.innerHTML = ''; return; }

        // ------------------------------------------------------------------
        // 1. Handle [CODE_START]...[CODE_END] sentinels → highlighted blocks
        // ------------------------------------------------------------------
        const LANG_MAP = {
            'lua':'lua','python':'python','javascript':'javascript','java':'java',
            'cpp':'cpp','c++':'cpp','c':'c','csharp':'csharp','c#':'csharp',
            'ruby':'ruby','php':'php','bash':'bash','shell':'shell','sql':'sql',
            'html':'xml','xml':'xml','css':'css','json':'json',
        };

        const AUTO_LANGS = ['lua','python','javascript','typescript','java','cpp','c','csharp','php','ruby','bash','shell','sql','xml','css','json'];

        function detectCodeLanguage(code) {
            const s = String(code || '');
            const trimmed = s.trim();
            if (!trimmed) return null;

            const scores = new Map(AUTO_LANGS.map(lang => [lang, 0]));
            const add = (lang, pts) => scores.set(lang, (scores.get(lang) || 0) + pts);
            const has = (re) => re.test(s);

            if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
                try { JSON.parse(trimmed); add('json', 12); } catch {}
            }

            if (has(/<\?php|\$[A-Za-z_]\w*\s*=|echo\s+['"]/)) add('php', 8);
            if (has(/\b(local|end|then|elseif)\b|--\[\[|--[^\n]*|\bgame:GetService\b|\bscript\.Parent\b|\bwait\(/)) add('lua', 10);
            if (has(/\b(def|elif|self|lambda|import|from)\b|:\s*(#.*)?\n\s+\w|\bprint\(/)) add('python', 8);
            if (has(/\b(function|const|let|var|=>|document\.|window\.|console\.log|require\(|import\s+.*from)\b/)) add('javascript', 8);
            if (has(/\binterface\s+\w+|:\s*(string|number|boolean|any)\b|as\s+const\b|type\s+\w+\s*=/)) add('typescript', 8);
            if (has(/\busing\s+System\b|\bnamespace\s+\w+|\bpublic\s+(class|static)|Console\.WriteLine|List<\w+>/)) add('csharp', 9);
            if (has(/\b#include\s*<|std::|cout\s*<<|cin\s*>>|\bint\s+main\s*\(/)) add('cpp', 9);
            if (has(/\b(public|private|protected)\s+class\b|System\.out\.println|new\s+\w+\(|@\w+\b/)) add('java', 7);
            if (has(/\bSELECT\b|\bFROM\b|\bWHERE\b|\bJOIN\b|\bINSERT\b|\bUPDATE\b|\bDELETE\b/i)) add('sql', 8);
            if (has(/^\s*(#!\/bin\/|sudo\s+|apt\s+|cd\s+|mkdir\s+|chmod\s+|curl\s+|wget\s+|echo\s+)/m)) add('bash', 7);
            if (has(/<\/?[a-z][\s\S]*>/i)) add('xml', 7);
            if (has(/[.#]?[A-Za-z_-][\w-]*\s*\{[\s\S]*:[\s\S]*\}/)) add('css', 7);

            const best = [...scores.entries()].sort((a, b) => b[1] - a[1])[0];
            return best && best[1] >= 7 ? best[0] : null;
        }

        function makeCodeBlock(rawCode, langHint) {
            // Parser output preserves HTML entities from the archived page.
            // Decode them before highlighting; highlight.js (or escapeHTML in
            // the fallback path) safely escapes the resulting source text.
            const cleanCode = decodeEntities(String(rawCode || ''))
                .replace(/^(?:\r?\n)+/, '')
                .replace(/(?:\r?\n)+$/, '');
            const hintedLang = LANG_MAP[(langHint||'').toLowerCase().trim()] || null;
            const detectedHint = hintedLang || detectCodeLanguage(cleanCode);
            const hljsLang = detectedHint && LANG_MAP[detectedHint] ? LANG_MAP[detectedHint] : detectedHint;
            let result;
            if (typeof hljs !== 'undefined') {
                result = hljsLang && hljs.getLanguage(hljsLang)
                    ? hljs.highlight(cleanCode, { language: hljsLang })
                    : hljs.highlightAuto(cleanCode, AUTO_LANGS.filter(lang => hljs.getLanguage(lang)));
            }
            const highlighted  = result ? result.value : escapeHTML(cleanCode);
            const detectedLang = (result?.language || hljsLang || 'code').toUpperCase();
            return `<div class="v3rm-code-container"><div style="background:#161616;color:#aaa;padding:6px 12px;font-family:monospace;font-size:11px;border-bottom:1px solid #222;">Code: ${detectedLang}</div><pre><code class="hljs">${highlighted}</code></pre></div>`;
        }

        // Split on code sentinels
        const parts = rawHtml.split(/\[CODE_START\]|\[CODE_END\]/);
        let processed = '';
        if (parts.length === 1) {
            processed = rawHtml;
        } else {
            if (parts[0]) processed += parts[0];
            for (let i = 1; i < parts.length; i += 2) {
                processed += makeCodeBlock(parts[i] || '', '');
                if (parts[i + 1]) processed += parts[i + 1];
            }
        }

        // ------------------------------------------------------------------
        // 2. Handle inline URLs in text nodes — image/iframely
        //    (parser already converted most, but plain URLs may remain)
        // ------------------------------------------------------------------
        // We'll handle this post-innerHTML via DOM walk to avoid breaking tags

        function escapeAttr(str) {
            return escapeHTML(str);
        }

        function normalizeMarkdownUrl(raw) {
            const trimmed = String(raw || '').trim();
            try {
                return encodeURI(decodeURI(trimmed));
            } catch {
                return encodeURI(trimmed);
            }
        }

        processed = processed
            .replace(/\r\n?/g, '\n')
            .replace(/\n[ \t\u00a0]*\n(?:[ \t\u00a0]*\n)+/g, '\n\n');

        function decodeWrappedUrl(raw) {
            let value = String(raw || '').trim();
            for (let i = 0; i < 3; i++) {
                try {
                    const decoded = decodeURIComponent(value);
                    if (decoded === value) break;
                    value = decoded;
                } catch {
                    break;
                }
            }
            return value;
        }

        function unwrapExternalImageProxy(raw) {
            let src = String(raw || '').trim();
            const localWrapped = src.match(/^\/static\/images\/(https?:\/\/.+)$/i) || src.match(/^\/images\/(https?:\/\/.+)$/i);
            if (localWrapped) src = localWrapped[1];

            try {
                const url = new URL(src, window.location.origin);
                const host = url.hostname.toLowerCase();
                const wrappedUrl = url.searchParams.get('u') || url.searchParams.get('url');
                if (wrappedUrl && (host === 'external-content.duckduckgo.com' || host.endsWith('.duckduckgo.com'))) {
                    return normalizeMarkdownUrl(decodeWrappedUrl(wrappedUrl));
                }
            } catch {}

            return normalizeMarkdownUrl(src);
        }

        function markdownImageHtml(alt, src) {
            const safeSrc = unwrapExternalImageProxy(src);
            const safeAlt = escapeAttr(alt);
            if (isIframelyUrl(safeSrc)) {
                return `<div class="v3rm-embed-slot" data-iframely-url="${escapeAttr(safeSrc)}"><span class="embed-loading">Loading embed…</span></div>`;
            }
            return `<img src="${escapeAttr(safeSrc)}" alt="${safeAlt}" class="v3rm-embedded-img" loading="lazy">`;
        }

        function markdownLinkHtml(text, href) {
            const safeHref = normalizeMarkdownUrl(href);
            return `<a href="${escapeAttr(safeHref)}" target="_blank" rel="noopener">${escapeHTML(String(text || '').trim())}</a>`;
        }

        function rewriteV3rmillionLinks(container) {
            container.querySelectorAll('a[href*="v3rmillion.net"]').forEach(link => {
                const href = link.getAttribute('href');
                try {
                    const url = new URL(href);
                    const tid = url.searchParams.get('tid');
                    const uid = url.searchParams.get('uid');
                    if (tid) {
                        link.setAttribute('href', `/static/search.html?id=${tid}`);
                    } else if (uid) {
                        link.setAttribute('href', `/static/search.html?mode=fts&uid=${uid}`);
                    } else {
                        link.setAttribute('href', '#');
                    }
                    link.textContent = href;
                } catch {}
            });
        }

        // Convert markdown image/link syntax emitted by the parser before
        // bare URL detection, so URLs inside markdown are never linkified twice.
        processed = processed
            .replace(/!\[([\s\S]*?)\]\(([^)\s]+(?:\s+[^)]*?)?)\)/g, (_, alt, src) => markdownImageHtml(alt, src))
            .replace(/(^|[^!])\[([\s\S]*?)\]\(([^)\s]+(?:\s+[^)]*?)?)\)/g, (_, prefix, text, href) => {
                return prefix + markdownLinkHtml(text, href);
            });

        container.innerHTML = processed;

        // ------------------------------------------------------------------
        // 3. Wire spoiler toggles for <div class="v3rm-spoiler"> elements
        // ------------------------------------------------------------------
        container.querySelectorAll('div.v3rm-spoiler').forEach(spoilerDiv => {
            const wrap   = document.createElement('div');
            wrap.className = 'v3rm-spoiler-wrap';

            const toggle = document.createElement('div');
            toggle.className = 'v3rm-spoiler-toggle';
            toggle.innerHTML = '<span class="spoiler-arrow">▶</span> Spoiler';

            const body = document.createElement('div');
            body.className = 'v3rm-spoiler-body';
            // Move children from the parser's v3rm-spoiler div into our body
            while (spoilerDiv.firstChild) body.appendChild(spoilerDiv.firstChild);

            toggle.addEventListener('click', () => {
                const open = body.classList.toggle('open');
                toggle.classList.toggle('open', open);
            });

            wrap.appendChild(toggle);
            wrap.appendChild(body);
            spoilerDiv.replaceWith(wrap);
        });

        // ------------------------------------------------------------------
        // 4. Remove leaked MyBB spoiler/collapse UI anchors
        // ------------------------------------------------------------------
        container.querySelectorAll('a[href^="javascript:void"]').forEach(link => {
            const rawText = link.textContent || '';
            const cleanedText = rawText
                .replace(/<img\b[^>]*collapse(?:_collapsed)?\.(?:png|gif)[^>]*>/ig, '')
                .trim();

            if (cleanedText) {
                link.replaceWith(document.createTextNode(cleanedText));
            } else {
                link.remove();
            }
        });

        // ------------------------------------------------------------------
        // 5. Plain image markdown ![](...) not already converted by parser
        //    Process any bare image URLs left as text or in <a> tags
        // ------------------------------------------------------------------
        container.querySelectorAll('img').forEach(img => {
            const rawSrc = img.getAttribute('src') || img.src || '';
            const rawAlt = img.getAttribute('alt') || '';
            const iconName = rawSrc.split('?')[0].split('/').pop().toLowerCase();
            if ((iconName === 'collapse_collapsed.png' || iconName === 'collapse.png' || iconName === 'collapse_collapsed.gif' || iconName === 'collapse.gif')
                && (rawAlt === '[+]' || rawAlt === '[-]' || rawAlt === '+' || rawAlt === '-')) {
                img.remove();
                return;
            }
            img.className = 'v3rm-embedded-img';
            img.loading   = 'lazy';
            if (!img.alt) img.alt = '';
            img.src = unwrapExternalImageProxy(rawSrc);
        });

        // ------------------------------------------------------------------
        // 6. Bare URLs in text — wrap iframely hosts in embed slots
        // ------------------------------------------------------------------
        // Walk text nodes and replace bare URLs
        function wrapBareUrls(container) {
            function _walk(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    // If the immediate parent is a link or code container, do not touch it
                    const parentTag = node.parentNode ? node.parentNode.tagName.toLowerCase() : '';
                    if (['a', 'script', 'style', 'code', 'pre'].includes(parentTag)) return;

                    const text = node.nodeValue;
                    // Match URLs up to whitespace or obvious closing delimiters.
                    const parts = text.split(/(https?:\/\/[^\s<>"'\]\)]+)/g);
                    if (parts.length <= 1) return;

                    const frag = document.createDocumentFragment();
                    parts.forEach((part, i) => {
                        if (i % 2 === 0) {
                            frag.appendChild(document.createTextNode(part));
                        } else {
                            // Extract trailing punctuation dynamically from the match without eating valid query parameter bounds
                            let url = part;
                            const trailingMatch = url.match(/['";.,\)>]+$/);
                            let trailingText = '';
                            if (trailingMatch) {
                                trailingText = trailingMatch[0];
                                url = url.slice(0, -trailingText.length);
                            }
                            url = url.trim();

                            if (isImageUrl(url)) {
                                const img = document.createElement('img');
                                img.src = url;
                                img.className = 'v3rm-embedded-img';
                                img.loading = 'lazy';
                                frag.appendChild(img);
                            } else if (isIframelyUrl(url)) {
                                const slot = document.createElement('div');
                                slot.className = 'v3rm-embed-slot';
                                slot.setAttribute('data-iframely-url', url);
                                slot.innerHTML = '<span class="embed-loading">Loading embed…</span>';
                                frag.appendChild(slot);
                            } else {
                                const a = document.createElement('a');
                                a.href = url;
                                a.target = '_blank';
                                a.rel = 'noopener';
                                a.textContent = url;
                                frag.appendChild(a);
                            }

                            if (trailingText) {
                                frag.appendChild(document.createTextNode(trailingText));
                            }
                        }
                    });
                    node.parentNode.replaceChild(frag, node);
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    const tag = node.tagName.toLowerCase();
                    if (!['script', 'style', 'code', 'pre', 'a'].includes(tag)) {
                        [...node.childNodes].forEach(_walk);
                    }
                }
            }
            _walk(container);
            rewriteV3rmillionLinks(container);
        }
        wrapBareUrls(container);

        container.normalize();
        [...container.childNodes].forEach(node => {
            if (node.nodeType !== Node.TEXT_NODE) return;
            const nextTag = node.nextSibling && node.nextSibling.nodeType === Node.ELEMENT_NODE
                ? node.nextSibling.tagName.toLowerCase()
                : '';
            const prevTag = node.previousSibling && node.previousSibling.nodeType === Node.ELEMENT_NODE
                ? node.previousSibling.tagName.toLowerCase()
                : '';
            const nextIsMediaBlock = node.nextSibling && node.nextSibling.nodeType === Node.ELEMENT_NODE
                && (node.nextSibling.classList.contains('v3rm-embed-slot')
                    || node.nextSibling.classList.contains('v3rm-code-container')
                    || node.nextSibling.classList.contains('v3rm-embedded-img'));
            const prevIsMediaBlock = node.previousSibling && node.previousSibling.nodeType === Node.ELEMENT_NODE
                && (node.previousSibling.classList.contains('v3rm-embed-slot')
                    || node.previousSibling.classList.contains('v3rm-code-container')
                    || node.previousSibling.classList.contains('v3rm-embedded-img'));

            if (['a', 'img', 'div', 'iframe'].includes(nextTag)) {
                node.nodeValue = node.nodeValue.replace(/[ \t\u00a0]+$/g, '');
                node.nodeValue = node.nodeValue.replace(/(\n)[ \t\u00a0]+$/g, '$1');
            }
            if (['a', 'img', 'div', 'iframe'].includes(prevTag)) {
                node.nodeValue = node.nodeValue.replace(/^[ \t\u00a0]+/g, '');
            }
            if (nextIsMediaBlock) {
                node.nodeValue = node.nodeValue.replace(/[ \t\u00a0]*\n[ \t\u00a0]*(?:\n[ \t\u00a0]*)+$/g, '\n');
            }
            if (prevIsMediaBlock) {
                node.nodeValue = node.nodeValue.replace(/^[ \t\u00a0]*\n[ \t\u00a0]*(?:\n[ \t\u00a0]*)+/g, '\n');
            }
            node.nodeValue = node.nodeValue.replace(/\n[ \t\u00a0]+(?=\S)/g, '\n');
        });

        container.querySelectorAll('a').forEach(link => {
            const next = link.nextSibling;
            if (next && next.nodeType === Node.TEXT_NODE) {
                next.nodeValue = next.nodeValue.replace(/^[ \t\u00a0]*\n[ \t\u00a0]*/g, ' ');
            }
            const prev = link.previousSibling;
            if (prev && prev.nodeType === Node.TEXT_NODE) {
                if (/^[ \t\u00a0]+$/.test(prev.nodeValue)) {
                    prev.remove();
                } else {
                    prev.nodeValue = prev.nodeValue.replace(/[ \t\u00a0]*\n[ \t\u00a0]*$/g, '\n');
                }
            }
        });

        // ------------------------------------------------------------------
        // 7. Collapse oversized and nested quote chains without discarding
        //    any archived content. Nested generations receive a shorter
        //    preview so quote pyramids do not dominate the current reply.
        // ------------------------------------------------------------------
        const quotes = [...container.querySelectorAll('blockquote.v3rm-quote')];
        const quoteDepth = new Map(quotes.map(quote => {
            let depth = 0;
            let parent = quote.parentElement;
            while (parent && parent !== container) {
                if (parent.matches('blockquote.v3rm-quote')) depth++;
                parent = parent.parentElement;
            }
            return [quote, depth];
        }));

        [...quotes].sort((a, b) => quoteDepth.get(b) - quoteDepth.get(a)).forEach(quote => {
            const depth = quoteDepth.get(quote) || 0;
            const previewHeight = depth > 0 ? 120 : 300;
            const containsHeavyContent = [...quote.querySelectorAll(
                'img, iframe, .v3rm-code-container, .v3rm-embed-slot'
            )].some(element => element.closest('blockquote.v3rm-quote') === quote);
            if (!containsHeavyContent && quote.scrollHeight <= previewHeight) return;

            const shell = document.createElement('div');
            shell.className = 'v3rm-quote-shell';
            quote.before(shell);
            shell.appendChild(quote);
            quote.classList.add('quote-collapsed');
            quote.style.setProperty('--quote-preview-height', `${previewHeight}px`);

            const fade = document.createElement('div');
            fade.className = 'v3rm-quote-fade';

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'v3rm-quote-toggle';
            toggle.setAttribute('aria-expanded', 'false');
            const collapsedLabel = depth > 0 ? 'Show earlier quote' : 'Show full quote';
            toggle.innerHTML = `<i class="fa fa-chevron-down"></i> ${collapsedLabel}`;

            toggle.addEventListener('click', () => {
                const expanded = shell.classList.toggle('expanded');
                toggle.setAttribute('aria-expanded', String(expanded));
                toggle.innerHTML = expanded
                    ? '<i class="fa fa-chevron-up"></i> Collapse quote'
                    : `<i class="fa fa-chevron-down"></i> ${collapsedLabel}`;
            });

            shell.appendChild(fade);
            shell.appendChild(toggle);
        });
    }

    function parseFallbackDate(post) {
        if (post.post_date && post.post_date.trim() !== '') return post.post_date;
        if (post.last_edit && post.last_edit.includes('modified:')) {
            const m = post.last_edit.match(/modified:\s*([^)]+)/i);
            if (m && m[1]) return m[1].trim();
        }
        return 'Archived Post';
    }

    function buildPostHTML(post, isOP = false, depth = 0) {
        postCounter++;
        const num = postCounter;

        const authorName  = post.author_username || 'Unknown';
        const authorId    = post.author_id       || '';
        const displayDate = parseFallbackDate(post);

        let editNotice = '';
        const postDateStr = (post.post_date || '').trim();
        const lastEditStr = (post.last_edit  || '').trim();
        if (lastEditStr && postDateStr && lastEditStr !== postDateStr) {
            editNotice = `(This post was last modified: ${lastEditStr} by ${authorName})`;
        }

        const statsLine   = '';
        const rankBadge   = post.user_rank  ? `<span style="font-size:10px;background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:1px 5px;border-radius:3px;margin-left:5px;">${escapeHTML(post.user_rank)}</span>` : '';
        const titleLine   = post.user_title ? `<div style="font-size:11px;color:#666;font-style:italic;margin-top:1px;">${escapeHTML(post.user_title)}</div>` : '';
        const starsLine   = (post.user_stars > 0) ? `<div style="font-size:10px;color:#888;margin-top:1px;">${'★'.repeat(Math.min(post.user_stars, 10))}</div>` : '';
        const repLine     = (post.reputation != null && post.reputation !== '') ? `<div style="font-size:10px;margin-top:1px;">Rep: <strong style="color:${parseInt(post.reputation) >= 0 ? '#29cb09' : '#b40404'};">${escapeHTML(String(post.reputation))}</strong></div>` : '';
        const postIdBadge   = post.post_id ? `<span style="font-size:10px;color:#444;margin-left:6px;">post_${escapeHTML(String(post.post_id))}</span>` : '';
        const authorIdBadge = authorId     ? `<span style="font-size:10px;color:#444;margin-left:6px;">uid_${escapeHTML(String(authorId))}</span>`   : '';

        const authorClick = authorId
            ? `onclick="showUserProfile('${escapeHTML(String(authorId))}','${escapeHTML(authorName)}')" title="View profile"`
            : '';

        // Build post element (use DOM to safely inject HTML body)
        const wrapper = document.createElement('div');
        wrapper.innerHTML = `
            <div class="v3rm-post">
                <div class="v3rm-post-head">
                    <span class="v3rm-post-date-wrapper">
                        <span>${displayDate} by ${escapeHTML(authorName)}</span>
                        ${editNotice ? `<span class="v3rm-edited">${escapeHTML(editNotice)}</span>` : ''}
                        ${authorIdBadge}${postIdBadge}
                    </span>
                    <span class="v3rm-post-num">#${num}</span>
                </div>
                <div class="v3rm-post-author">
                    <div class="w-100">
                        <div class="d-flex align-items-center">
                            <div class="v3rm-author-name ${isOP ? 'op' : ''}" ${authorClick}>
                                <strong>${escapeHTML(authorName)}</strong>
                                ${isOP ? '<span style="font-size:10px;color:#888;">[OP]</span>' : ''}
                            </div>
                            ${rankBadge}
                        </div>
                        ${titleLine}${starsLine}${repLine}
                    </div>
                </div>
                <div class="v3rm-post-content">
                    <div class="v3rm-post-body" data-post-body="1"></div>
                    <div class="v3rm-post-footer">
                        <span class="v3rm-like-btn"><i class="fa fa-thumbs-o-up"></i> ${escapeHTML(String(post.likes || '0'))}</span>
                        <span class="v3rm-like-btn"><i class="fa fa-thumbs-o-down"></i> ${escapeHTML(String(post.dislikes || '0'))}</span>
                    </div>
                </div>
                <div class="v3rm-post-controls">
                    ${post.replied_to ? `<span style="color:#888;font-size:11px;">↩ Reply to <strong style="color:#cd1818;">${escapeHTML(post.replied_to)}</strong> (${escapeHTML(post.replied_to_post_date || '')})</span>` : ''}
                </div>
            </div>`;

        // Safely render the HTML post body (handles spoilers, images, code, etc.)
        const bodyEl = wrapper.querySelector('[data-post-body]');
        renderPostBody(bodyEl, post.post_description || '');

        // Recurse into replies
        if (post.replies && post.replies.length > 0) {
            const replyWrap = document.createElement('div');
            replyWrap.className = 'v3rm-reply-wrap';
            post.replies.forEach(r => replyWrap.appendChild(buildPostHTML(r, false, depth + 1)));
            wrapper.appendChild(replyWrap);
        }

        return wrapper;
    }

    // ════════════════════════════════════════════════════════════════════════
    // THREAD VIEWER MODAL
    // ════════════════════════════════════════════════════════════════════════
    function showThreadViewerModal(data, id = '', jumpToPostId = null) {
        document.querySelectorAll('.viewer-overlay').forEach(e => e.remove());

        const POSTS_PER_PAGE = 50;
        const threadRow      = data.thread || {};
        
        // ─── ENTITY DECODER INTEGRATION ───
        // Clean out raw HTML encoded values instantly before processing escaping rules
        const cleanTitle     = decodeEntities(threadRow.title || 'Untitled Thread').trim();

        let categories = [];
        try { 
            categories = typeof threadRow.categories === 'string' ? JSON.parse(threadRow.categories) : (threadRow.categories || []); 
        } catch {}
        
        // Clean category items as well
        const sanitizedCategories = categories.map(cat => decodeEntities(cat));
        const categoryBreadcrumbs = sanitizedCategories.length > 0 ? sanitizedCategories.join(' » ') : '';
        // ──────────────────────────────────

        const pageCache     = new Map();
        let pageOffset      = Number(data.offset || 0);
        let pagePosts       = data.posts || [];
        const totalPosts    = Number(data.total ?? pagePosts.length);
        const totalPages    = Math.max(1, Math.ceil(totalPosts / POSTS_PER_PAGE));
        let currentModalPage = Math.floor(pageOffset / POSTS_PER_PAGE) + 1;
        pageCache.set(currentModalPage, pagePosts);

        const overlay = document.createElement('div');
        overlay.className = 'viewer-overlay';
        overlay.innerHTML = `
            <div class="viewer-card">
                <div class="viewer-header">
                    <div style="overflow:hidden;flex-grow:1;">
                        <div class="d-flex align-items-center" style="gap:10px;">
                            <div class="viewer-header-title" title="${escapeHTML(cleanTitle)}" style="max-width:80%;">${escapeHTML(cleanTitle)}</div>
                            ${id ? `<button class="copy-link-btn" id="modal-copy-btn" data-thread-id="${id}"><i class="fa fa-link"></i> Copy Link</button>` : ''}
                        </div>
                        ${categoryBreadcrumbs ? `<div class="v3rm-category-path" style="margin-top:2px;">${escapeHTML(categoryBreadcrumbs)}</div>` : ''}
                    </div>
                    <button class="viewer-close-btn" id="close-modal-btn">✕ Close</button>
                </div>
                <div id="modal-post-pagination" style="display:none;padding:6px 10px;background:#111;border-bottom:1px solid #222;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;flex-shrink:0;"></div>
                <div class="viewer-body" id="modal-viewer-body"></div>
            </div>`;
        document.body.appendChild(overlay);

        async function loadModalPage(page) {
            if (!pageCache.has(page)) {
                const offset = (page - 1) * POSTS_PER_PAGE;
                const params = new URLSearchParams({ thread_id: id, limit: POSTS_PER_PAGE, offset });
                const res = await apiFetch(`/api/thread?${params}`);
                const pageData = await res.json();
                if (pageData.error) throw new Error(pageData.error);
                pageCache.set(page, pageData.posts || []);
            }
            pageOffset = (page - 1) * POSTS_PER_PAGE;
            pagePosts = pageCache.get(page);
            renderModalPage(page);
        }

        function renderModalPage(page) {
            currentModalPage = page;
            postCounter = 0;
            const viewerBody = overlay.querySelector('#modal-viewer-body');
            viewerBody.innerHTML = '';
            viewerBody.scrollTop = 0;

            const slice = pagePosts.map((post, idx) => ({
                post,
                isOP: Number(post.is_op) === 1 || pageOffset + idx === 0,
            }));

            if (!slice.length) {
                viewerBody.innerHTML = '<p style="color:#666;padding:20px;text-align:center;">No posts found for this thread.</p>';
            } else {
                const frag = document.createDocumentFragment();
                slice.forEach(({ post, isOP }) => frag.appendChild(buildPostHTML(post, isOP, 0)));
                viewerBody.appendChild(frag);
                resolveIframelySlots(viewerBody);
            }
            renderModalPagination();

            if (jumpToPostId && page === currentModalPage) {
                setTimeout(() => {
                    const allPostEls = viewerBody.querySelectorAll('.v3rm-post');
                    const localIdx = pagePosts
                        .findIndex(post => String(post.post_id) === String(jumpToPostId));
                    if (localIdx !== -1 && allPostEls[localIdx]) {
                        allPostEls[localIdx].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 80);
            }
        }

        function renderModalPagination() {
            const bar = overlay.querySelector('#modal-post-pagination');
            if (totalPages <= 1) { bar.style.display = 'none'; return; }
            bar.style.display = 'flex';
            const s = (dis, act) => {
                const b = 'border:1px solid #2a2a2a;padding:2px 8px;font-size:11px;cursor:pointer;border-radius:2px;';
                if (dis) return b + 'background:#0a0a0a;color:#333;cursor:not-allowed;';
                if (act) return b + 'background:#cd1818;border-color:#cd1818;color:#fff;';
                return b + 'background:#1a1a1a;color:#cd1818;';
            };
            let html = `<span style="font-size:11px;color:#666;">Page ${currentModalPage} of ${totalPages} &nbsp;·&nbsp; ${totalPosts} posts</span>`;
            html += '<div style="display:flex;gap:4px;flex-wrap:wrap;">';
            html += `<button onclick="modalGoTo(${currentModalPage-1})" style="${s(currentModalPage<=1)}">&laquo; Prev</button>`;
            let sp = Math.max(1, currentModalPage-3), ep = Math.min(totalPages, sp+6);
            if (ep-sp<6) sp = Math.max(1, ep-6);
            for (let i=sp;i<=ep;i++) html += `<button onclick="modalGoTo(${i})" style="${s(false,i===currentModalPage)}">${i}</button>`;
            html += `<button onclick="modalGoTo(${currentModalPage+1})" style="${s(currentModalPage>=totalPages)}">Next &raquo;</button>`;
            html += '</div>';
            bar.innerHTML = html;
        }

        window.modalGoTo = async (page) => {
            if (page < 1 || page > totalPages) return;
            try {
                await loadModalPage(page);
            } catch (err) {
                alert('Error loading thread page: ' + err.message);
            }
        };

        renderModalPage(currentModalPage);

        const copyBtn = overlay.querySelector('#modal-copy-btn');
        if (copyBtn) {
            copyBtn.onclick = function() {
                const url = window.location.origin + window.location.pathname + '?id=' + this.getAttribute('data-thread-id');
                // Try to write to clipboard, but gracefully fall back to selecting the URL
                // for manual copy if the API is unavailable or permission is denied.
                navigator.clipboard.writeText(url).then(() => {
                    copyBtn.innerHTML = '<i class="fa fa-check"></i> Copied!';
                    setTimeout(() => { copyBtn.innerHTML = '<i class="fa fa-link"></i> Copy Link'; }, 2000);
                }).catch((err) => {
                    console.warn('Clipboard write failed, falling back to manual select:', err);
                    try {
                        // Create a temporary input to select the URL for manual copying
                        const tmp = document.createElement('input');
                        tmp.style.position = 'fixed'; tmp.style.left = '-9999px';
                        tmp.value = url;
                        document.body.appendChild(tmp);
                        tmp.select();
                        tmp.setSelectionRange(0, tmp.value.length);
                        document.execCommand('copy');
                        document.body.removeChild(tmp);
                        copyBtn.innerHTML = '<i class="fa fa-check"></i> Copied!';
                        setTimeout(() => { copyBtn.innerHTML = '<i class="fa fa-link"></i> Copy Link'; }, 2000);
                    } catch (e) {
                        // As a last resort, just show the URL in an alert and let the user copy manually
                        document.body.removeChild(tmp);
                        window.prompt('Copy this link', url);
                    }
                });
            };
        }

        const clearUrlParam = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.has('id')) {
                if (window.history.state === null && document.referrer === '') {
                    window.location.href = window.location.origin + window.location.pathname;
                } else {
                    window.history.back();
                }
            } else {
                overlay.remove();
            }
        };

        overlay.querySelector('#close-modal-btn').onclick = clearUrlParam;
        overlay.addEventListener('click', e => { if (e.target === overlay) clearUrlParam(); });
    }

    // ════════════════════════════════════════════════════════════════════════
    // POPSTATE
    // ════════════════════════════════════════════════════════════════════════
    window.addEventListener('popstate', async function() {
        const params   = new URLSearchParams(window.location.search);
        const threadId = params.get('id');
        document.querySelectorAll('.viewer-overlay').forEach(e => e.remove());

        if (threadId) { await fetchAndRenderThread(threadId); return; }

        const mode = params.get('mode');
        if (mode === 'fts') {
            switchMode('fts');
            const q = params.get('q') || '', author = params.get('uid') || '';
            if (q)      document.getElementById('ftsInput').value  = q;
            if (author) document.getElementById('ftsAuthor').value = author;
            if (q || author) {
                suppressUrlUpdate = true;
                triggerFtsSearch();
                suppressUrlUpdate = false;
            }
            return;
        }

        switchMode('index');
        const cat   = params.get('cat')   || '';
        const smode = params.get('smode') || 'title';
        const query = params.get('q')     || '';
        const sort  = params.get('sort')  || 'relevance';
        const order = params.get('order') || 'asc';
        if (cat) document.getElementById('categoryDropdown').value = cat;
        const ms2 = document.getElementById('searchTarget');
        ms2.value = smode; ms2.dispatchEvent(new Event('change'));
        document.getElementById('searchInput').value  = query;
        document.getElementById('sortBy').value       = sort;
        document.getElementById('sortOrder').value    = order;
        indexLastParams = { q: query, cat, smode, sort, order };
        suppressUrlUpdate = true;
        runIndexQuery(parseInt(params.get('offset') || '0', 10), true);
        suppressUrlUpdate = false;
    });
    </script>
